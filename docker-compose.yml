version: '3.8'

services:
  # Web Application (Next.js)
  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
    container_name: joblane-web
    ports:
      - "1111:1111"
    environment:
      - NODE_ENV=development
      - PORT=1111
      - NEXT_PUBLIC_API_URL=${API_URL}
      - NEXT_PUBLIC_WEB_URL=${WEB_URL}
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/.next
      - /app/apps/web/node_modules
    depends_on:
      - api
    networks:
      - joblane-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1111"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Application (FastAPI)
  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    container_name: joblane-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - AI_PROVIDER=${AI_PROVIDER}
      - RATE_LIMIT=${RATE_LIMIT}
      - PYTHONPATH=/app/apps/api
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - joblane-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker Application (Celery)
  worker:
    build:
      context: .
      dockerfile: infra/docker/worker/Dockerfile
    container_name: joblane-worker
    environment:
      - APP_ENV=${APP_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - AI_PROVIDER=${AI_PROVIDER}
      - PYTHONPATH=/app/apps/worker
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages
    depends_on:
      - api
      - redis
      - postgres
    networks:
      - joblane-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "apps.worker.main", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: joblane-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=joblane
      - POSTGRES_PASSWORD=joblane
      - POSTGRES_DB=joblane
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - joblane-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joblane -d joblane"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: joblane-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - joblane-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # MinIO Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: joblane-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - joblane-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Mailpit for Email Testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: joblane-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - joblane-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PGAdmin for Database Management (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: joblane-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@joblane.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - joblane-network
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  joblane-network:
    driver: bridge